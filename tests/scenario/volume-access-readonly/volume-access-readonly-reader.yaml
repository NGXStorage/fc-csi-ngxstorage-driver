apiVersion: v1
kind: Pod
metadata:
  name: volume-access-readonly-reader
  namespace: default
spec:
  # Writer ile aynı node: staging bir kez yapılır; reader volume-access-readonly publish eder.
  nodeSelector:
    kubernetes.io/hostname: REPLACE_WITH_WORKER_NODE
  containers:
  - name: reader
    image: nginx
    command: ["/bin/sh", "-c"]
    args:
    - >
      cat /data/writer.txt || echo "writer verisi okunamadı";
      if echo "x" > /data/readonly-test 2>/dev/null; then
        echo "READONLY IHLAL: yazılabildi!";
      else
        echo "READONLY OK: volume-access-readonly mount'a yazılamadı";
      fi;
      tail -f /dev/null
    volumeMounts:
    - name: pvc
      mountPath: /data
      readOnly: true
  volumes:
  - name: pvc
    persistentVolumeClaim:
      claimName: volume-access-readonly-pvc
