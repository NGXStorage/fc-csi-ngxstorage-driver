apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: volume-access-readonly-sc
provisioner: fc.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  blocksize: "128k"
  thin_provision: "on"
  deduplication: "off"
  compression: "off"
  io_type: "transactional"
  qos_priority: "16"
