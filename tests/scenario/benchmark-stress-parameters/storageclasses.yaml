# A representative matrix of LUN create parameters. Each StorageClass exercises
# a distinct backend attribute combination; use them to smoke-test provisioning
# and (with VAC) mutable-parameter changes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fc-blk-thin-dedup-comp
provisioner: fc.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  blocksize: "128k"
  thin_provision: "on"
  deduplication: "on"
  compression: "on"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fc-blk-thin-io-seq
provisioner: fc.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  blocksize: "64k"
  thin_provision: "on"
  io_type: "sequential"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fc-blk-thick-qos64
provisioner: fc.csi.ngxstorage.com
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  blocksize: "4k"
  thin_provision: "off"
  qos_priority: "64"
