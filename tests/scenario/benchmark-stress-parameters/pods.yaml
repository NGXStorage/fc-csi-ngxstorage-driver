apiVersion: v1
kind: Pod
metadata:
  name: fc-stress-a
  namespace: default
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: ""
  containers:
  - name: stress
    image: busybox
    command: ["sleep", "3600"]
    volumeMounts:
    - name: pvc
      mountPath: /data
  volumes:
  - name: pvc
    persistentVolumeClaim:
      claimName: fc-stress-a
---
