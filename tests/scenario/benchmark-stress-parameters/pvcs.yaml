apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fc-stress-a
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: fc-blk-thin-dedup-comp
